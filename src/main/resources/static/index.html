<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion ou Inscription - Notre Site Web</title>
    <meta name="description" content="Connectez-vous ou créez un nouveau compte sur notre site pour accéder à toutes nos fonctionnalités.">
    <meta name="author" content="Vortex Makers">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="forms-container">
        <!-- Boutons des onglets -->
        <div class="tabs">
            <button class="tab-button active" data-tab="login">Connexion</button>
            <button class="tab-button" data-tab="register">Inscription</button>
        </div>

        <!-- Conteneur des formulaires -->
        <div class="form-content">
            <!-- Page de Connexion -->
            <div id="login-form" class="login-form active">
                <h2>Connexion</h2>
                <form>
                    <input type="text" name="login" placeholder="Nom d'utilisateur" required>
                    <input type="password" name="password" placeholder="Mot de passe" required>
                    <button type="submit">Se connecter</button>
                </form>
                <p><a href="/mot-de-passe-oublie">Mot de passe oublié ?</a></p>
            </div>

            <!-- Page d'Inscription -->
            <div id="register-form" class="register-form">
                <h2>Inscription</h2>
                <form>
                    <input type="text" name="nom" placeholder="Nom" required>
                    <input type="text" name="prenom" placeholder="Prénom" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="text" name="filiere" placeholder="Filière" required>
                    <input type="date" name="dateNaiss" placeholder="Date de naissance" required>
                    <input type="password" name="password" placeholder="Mot de passe" required>
                    <input type="password" name="confirmPassword" placeholder="Confirmer le mot de passe" required>
                    <button type="submit">S'inscrire</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
